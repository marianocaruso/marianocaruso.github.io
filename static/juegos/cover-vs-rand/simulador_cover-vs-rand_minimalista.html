<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador: Estrategia de Cover</title>
    
    <!-- Cargando Tailwind CSS para estilos utilitarios -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #10121a;
            --bg-panel: #1a1d27;
            --color-cyan: #5ab9c1;
            --color-orange: #f6a04d;
            --color-text: #e2e8f0;
        }
        
        body {
            /* Unificando toda la tipografía a Google Sans */
            font-family: 'Google Sans', 'Product Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--color-text);
            margin: 0;
            padding: 0;
        }

        .panel-glass {
            background-color: rgba(26, 29, 39, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .input-minimal {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--color-cyan);
            transition: all 0.3s ease;
        }

        .input-minimal:focus {
            outline: none;
            border-color: var(--color-cyan);
            box-shadow: 0 0 10px rgba(90, 185, 193, 0.2);
        }

        .btn-run {
            background: linear-gradient(90deg, rgba(90,185,193,0.1) 0%, rgba(90,185,193,0.25) 100%);
            border: 1px solid var(--color-cyan);
            color: var(--color-cyan);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-run:hover:not(:disabled) {
            background: rgba(90, 185, 193, 0.4);
            box-shadow: 0 0 20px rgba(90, 185, 193, 0.4);
            transform: translateY(-1px);
        }

        .btn-run:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.4);
            background: transparent;
        }

        .text-cyan-glow {
            color: var(--color-cyan);
            text-shadow: 0 0 10px rgba(90, 185, 193, 0.5);
        }

        .text-orange-glow {
            color: var(--color-orange);
            text-shadow: 0 0 10px rgba(246, 160, 77, 0.5);
        }

        canvas {
            width: 100%;
            height: 280px;
            display: block;
        }
    </style>
</head>
<body class="antialiased p-4 sm:p-8 min-h-screen flex items-center justify-center">

    <div class="max-w-3xl w-full mx-auto space-y-6">
        
        <div class="panel-glass rounded-2xl p-6 sm:p-8">
            <header class="text-center mb-8">
                <!-- Texto ampliado y actualizado -->
                <p class="text-gray-300 text-lg sm:text-xl leading-relaxed">Definí los valores ocultos a y b. Simulá varias rondas y verificá cuál es la mejor estrategia de decisión.</p>
            </header>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-xs text-gray-500 uppercase tracking-wider mb-2">a</label>
                    <input type="number" id="inputA" value="10" class="input-minimal w-full rounded-lg px-4 py-3 text-lg font-mono text-center">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 uppercase tracking-wider mb-2">b</label>
                    <input type="number" id="inputB" value="20" class="input-minimal w-full rounded-lg px-4 py-3 text-lg font-mono text-center">
                </div>
            </div>

            <div id="error-msg" class="text-red-400 text-xs text-center mb-4 hidden">Los valores de los sobres deben ser distintos.</div>

            <button id="btn-simulate" onclick="startSimulation()" class="btn-run w-full py-3 sm:py-4 rounded-xl font-bold text-sm mb-8 flex justify-center items-center gap-2">
                <span class="text-xl">↻</span> SIMULAR
            </button>

            <!-- Paneles intercambiados: Cover a la izquierda, Azar a la derecha -->
            <div class="grid grid-cols-2 gap-6 mb-6">
                <!-- Cover Strategy -->
                <div class="bg-black bg-opacity-40 rounded-xl p-4 text-center border border-cyan-900 relative overflow-hidden">
                    <div class="absolute inset-0 bg-cyan-900 bg-opacity-10"></div>
                    <div class="text-xs text-cyan-400 uppercase tracking-wider mb-1 relative z-10 font-semibold">Estrategia Cover</div>
                    <div class="text-3xl sm:text-3xl font-bold text-cyan-glow relative z-10 font-mono" id="stat-cover">0.0%</div>
                    <div class="text-xs text-gray-500 mt-2 relative z-10">tasa de victoria</div>
                </div>
                <!-- Random Strategy -->
                <div class="bg-black bg-opacity-40 rounded-xl p-4 text-center border border-gray-800">
                    <div class="text-xs text-orange-400 uppercase tracking-wider mb-1 font-semibold">Decisión al Azar</div>
                    <div class="text-3xl sm:text-3xl font-bold text-gray-300 font-mono" id="stat-random">0.0%</div>
                    <div class="text-xs text-gray-500 mt-2">tasa de victoria</div>
                </div>
            </div>

            <div class="w-full bg-black bg-opacity-30 rounded-xl border border-gray-800 relative p-4 mt-6">
                <canvas id="chartCanvas"></canvas>
                <div class="absolute top-4 left-6 text-[15px] text-gray-400 font-mono tracking-wider">tasa de victoria</div>
            </div>
        </div>
    </div>

    <script>
        // Variables globales
        let isSimulating = false;
        const TOTAL_ITERATIONS = 10000;
        const BATCH_SIZE = 100; // Iteraciones por frame de animación
        
        let historyCover = [];
        let historyRandom = [];

        // Generador de variable K
        // Para que la demostración visual sea contundente (~75% win rate),
        // concentramos la distribución uniformemente alrededor de los números a y b.
        // En un juego de ignorancia pura K sería más ancha y la ventaja menor,
        // pero la mecánica (romper la simetría) sigue siendo exactamente la misma.
        function generateK(min, max) {
            const diff = max - min;
            // Rango concentrado: [min - diff/2, max + diff/2]
            const lowerBound = min - (diff / 2);
            const upperBound = max + (diff / 2);
            return lowerBound + Math.random() * (upperBound - lowerBound);
        }

        // Función principal asíncrona para la simulación animada
        async function startSimulation() {
            if (isSimulating) return;

            const valA = parseFloat(document.getElementById('inputA').value);
            const valB = parseFloat(document.getElementById('inputB').value);
            const errorMsg = document.getElementById('error-msg');

            // Validación mínima
            if (isNaN(valA) || isNaN(valB) || valA === valB) {
                errorMsg.classList.remove('hidden');
                return;
            }
            errorMsg.classList.add('hidden');

            // Preparar UI
            isSimulating = true;
            document.getElementById('btn-simulate').disabled = true;
            document.getElementById('btn-simulate').innerHTML = 'Simulando...';
            
            // Reiniciar datos
            historyCover = [];
            historyRandom = [];
            let coverWins = 0;
            let randomWins = 0;
            let currentIteration = 0;

            const maxVal = Math.max(valA, valB);
            const minVal = Math.min(valA, valB);

            // Función de retardo para permitir renderizado (Yield to main thread)
            const sleep = ms => new Promise(r => setTimeout(r, ms));

            // Bucle principal (procesamiento por lotes)
            while (currentIteration < TOTAL_ITERATIONS) {
                
                for (let i = 0; i < BATCH_SIZE; i++) {
                    currentIteration++;
                    
                    // 1. Repartir sobres al azar
                    let observed = Math.random() > 0.5 ? valA : valB;
                    let hidden = observed === valA ? valB : valA;
                    
                    // 2. Estrategia Azar (50/50)
                    let randomSwitch = Math.random() > 0.5;
                    let randomFinal = randomSwitch ? hidden : observed;
                    if (randomFinal === maxVal) randomWins++;

                    // 3. Estrategia Cover
                    let K = generateK(minVal, maxVal);
                    let coverSwitch = observed < K; // Cambiar si lo observado es menor que el umbral
                    let coverFinal = coverSwitch ? hidden : observed;
                    if (coverFinal === maxVal) coverWins++;

                    // Guardar histórico (uno de cada X para optimizar dibujo)
                    if (currentIteration % 50 === 0) {
                        historyCover.push(coverWins / currentIteration);
                        historyRandom.push(randomWins / currentIteration);
                    }
                }

                // Actualizar UI cada lote
                updateUI(coverWins, randomWins, currentIteration);
                drawChart();
                
                // Pequeña pausa para animar
                await sleep(10); 
            }

            // Finalizar simulación
            isSimulating = false;
            document.getElementById('btn-simulate').disabled = false;
            document.getElementById('btn-simulate').innerHTML = `
                <span class="text-xl">↻</span> SIMULAR
            `;
        }

        function updateUI(cWins, rWins, total) {
            let pCover = (cWins / total) * 100;
            let pRandom = (rWins / total) * 100;

            document.getElementById('stat-cover').innerText = pCover.toFixed(1) + '%';
            document.getElementById('stat-random').innerText = pRandom.toFixed(1) + '%';
        }

        function drawChart() {
            const canvas = document.getElementById('chartCanvas');
            const ctx = canvas.getContext('2d');
            
            // Ajustar dimensiones internas
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            
            const w = canvas.width;
            const h = canvas.height;
            const padding = 20;

            ctx.clearRect(0, 0, w, h);

            if (historyCover.length === 0) return;

            // Ajustar dimensiones internas para aumentar la amplitud (zoom vertical)
            // Expandimos la vista desde 40% a 80% para mayor amplitud visual en el espacio vacío
            const minY = 0.40; 
            const maxY = 0.80; 
            const getY = (val) => {
                let clamped = Math.max(minY, Math.min(maxY, val));
                return h - padding - ((clamped - minY) / (maxY - minY)) * (h - 2 * padding);
            };
            const getX = (idx) => padding + (idx / Math.max(1, historyCover.length - 1)) * (w - 2 * padding);

            // Línea base del 50% recalculada para la nueva escala
            const y50 = getY(0.5);
            ctx.beginPath();
            ctx.moveTo(padding, y50);
            ctx.lineTo(w - padding, y50);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.setLineDash([]);

            // Etiqueta visual del 50% ubicada a la DERECHA, más grande y visible
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = 'bold 20px "Google Sans", "Product Sans", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('50%', w - padding, y50 - 10);
            ctx.textAlign = 'left'; // reset para futuros textos

            // Dibujar línea Estrategia Azar (Naranja/Gris)
            ctx.beginPath();
            ctx.moveTo(getX(0), getY(historyRandom[0]));
            for (let i = 1; i < historyRandom.length; i++) {
                ctx.lineTo(getX(i), getY(historyRandom[i]));
            }
            ctx.strokeStyle = '#f6a04d'; // Naranja tenue
            ctx.globalAlpha = 0.6;
            ctx.lineWidth = 2;
            ctx.stroke();

            // Dibujar línea Estrategia Cover (Cyan vibrante)
            ctx.globalAlpha = 1.0;
            ctx.beginPath();
            ctx.moveTo(getX(0), getY(historyCover[0]));
            for (let i = 1; i < historyCover.length; i++) {
                ctx.lineTo(getX(i), getY(historyCover[i]));
            }
            ctx.strokeStyle = '#5ab9c1';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#5ab9c1';
            ctx.shadowBlur = 12;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // Redibujar si cambia el tamaño de la ventana (responsive)
        window.addEventListener('resize', drawChart);

        // Inicializar un estado vacío al cargar
        window.onload = () => drawChart();

    </script>
</body>
</html>
