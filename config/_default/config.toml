# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/

baseURL = "https://marianocaruso.github.io/"
theme = "congo"
title = "Mariano Caruso" # título que aparece en las pestañas del navegador 
defaultContentLanguage = "es"

[params]
  description = "Research & Development"
  #logo = "img/logoc.png" # cuando ejecuto HUGO, esta linea me dió un warning, se puede eliminar
  # WARN  [CONGO] Theme parameter `logo` has been renamed to `header.logo`. Please update your site configuration.


enableRobotsTXT = true
paginate = 10
summaryLength = 0


[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]


[params.assets]
customCSS = ["css/custom.css"]


